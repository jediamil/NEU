build:
    name: NEU Health Student — shared clinic database
    steps:
        - eas/checkout
        - eas/install_node_modules
        - run:
              name: Generate the iPhone project and install native dependencies
              command: |
                  set -euo pipefail
                  npx expo prebuild --platform ios --no-install
                  updates_plist="$(find ios -name Expo.plist -print -quit)"
                  test -n "$updates_plist"
                  plist_tool=/usr/libexec/PlistBuddy
                  "$plist_tool" -c 'Add :EXUpdatesRequestHeaders dict' "$updates_plist" 2>/dev/null || true
                  "$plist_tool" -c 'Set :EXUpdatesRequestHeaders:expo-channel-name preview' "$updates_plist" 2>/dev/null ||
                    "$plist_tool" -c 'Add :EXUpdatesRequestHeaders:expo-channel-name string preview' "$updates_plist"
                  cd ios
                  pod install
        - run:
              name: Compile an offline Release app and package the sideload IPA
              command: bash scripts/package-ios.sh
        - eas/upload_artifact:
              name: Upload the iPhone IPA
              inputs:
                  type: application-archive
                  path: mobile/artifacts/NEU-Health-Student-Production.ipa
